name: Skills Validate

on:
  pull_request:
    paths:
      - 'SKILLS.md'
      - 'skills/**'
      - 'tests/test_skill_metadata.py'
      - 'templates/agent-skill-subsystem/**'
      - 'scripts/validate_skills.py'
      - '.github/workflows/skills-validate.yml'
  push:
    branches: [main]
    paths:
      - 'SKILLS.md'
      - 'skills/**'
      - 'tests/test_skill_metadata.py'
      - 'templates/agent-skill-subsystem/**'
      - 'scripts/validate_skills.py'
      - '.github/workflows/skills-validate.yml'

permissions:
  contents: read

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata test dependency
        run: python -m pip install PyYAML
      - name: Check skill metadata
        run: python -m unittest discover -s tests -p 'test_skill_metadata.py' -v
      - name: Validate SUAS specification skills
        run: python scripts/validate_skills.py
